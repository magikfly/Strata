name: Build and publish Strata for Blackwell

on:
  schedule:
    - cron: "30 6 * * *" # Check upstream once a day (UTC)
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream Strata tag (blank selects newest)"
        required: false
        type: string
        default: ""
      rebuild:
        description: "Rebuild even if this release tag is already published"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: strata-ghcr-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      IMAGE: ghcr.io/magikfly/strata
    steps:
      - name: Check out fork workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select upstream release
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM=https://github.com/Niko1221/Strata.git
          if [[ -n "$REQUESTED_TAG" ]]; then
            TARGET="$REQUESTED_TAG"
          else
            TARGET="$(git ls-remote --tags --refs "$UPSTREAM" 'refs/tags/v*' \
              | awk '{sub("refs/tags/", "", $2); print $2}' \
              | sort -V | tail -n 1)"
          fi
          [[ "$TARGET" =~ ^v[0-9]+([.][0-9]+)*([.-][0-9A-Za-z.-]+)?$ ]] \
            || { echo "Invalid release tag: $TARGET" >&2; exit 1; }
          git remote add upstream "$UPSTREAM"
          git fetch --quiet --depth=1 upstream "refs/tags/$TARGET:refs/tags/$TARGET"
          git checkout --quiet --detach "$TARGET"
          echo "tag=$TARGET" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building upstream Strata $TARGET ($(git rev-parse --short HEAD))"

      # Strata's Dockerfile defaults to -march=native for both binaries.
      # A hosted runner's CPU ISA is not the homeserver's, so build the x86 kernels portably.
      - name: Use portable AVX2 CPU kernels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Dockerfile")
          s = p.read_text()
          main_old = 'f"-DSTRATA_GGML_DIR={llama}"], None, "build-strata.bat")'
          main_new = 'f"-DSTRATA_GGML_DIR={llama}", "-DSTRATA_PORTABLE=ON"], None, "build-strata.bat")'
          vision_old = '"-DSTRATA_PORTABLE=OFF"'
          vision_new = '"-DSTRATA_PORTABLE=ON"'
          assert s.count(main_old) == 1, "upstream engine build command changed; review portability patch"
          assert s.count(vision_old) == 1, "upstream vision build command changed; review portability patch"
          p.write_text(s.replace(main_old, main_new, 1).replace(vision_old, vision_new, 1))
          print("Patched engine and vision to portable AVX2 CPU kernels; CUDA arch remains 120.")
          PY

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this upstream tag is already published
        id: published
        env:
          FORCE_REBUILD: ${{ inputs.rebuild }}
        shell: bash
        run: |
          if [[ "$FORCE_REBUILD" != "true" ]] && docker manifest inspect "$IMAGE:${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:${{ steps.release.outputs.tag }} already exists."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show runner disk space
        if: steps.published.outputs.skip != 'true'
        run: df -h

      - name: Set up Docker Buildx
        if: steps.published.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and publish GHCR tags
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            CUDA_ARCHITECTURES=120
          labels: |
            org.opencontainers.image.source=https://github.com/magikfly/Strata
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}

      - name: Report result
        if: always()
        env:
          RESULT: ${{ steps.published.outputs.skip }}
        run: |
          if [[ "$RESULT" == "true" ]]; then
            echo "Already published: $IMAGE:${{ steps.release.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ job.status }}" == "success" ]]; then
            echo "Published $IMAGE:latest and $IMAGE:${{ steps.release.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Upstream source: https://github.com/Niko1221/Strata/tree/${{ steps.release.outputs.tag }} (commit ${{ steps.release.outputs.sha }})" >> "$GITHUB_STEP_SUMMARY"
          fi
